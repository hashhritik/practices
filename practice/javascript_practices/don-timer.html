<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
      }
      .main {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      .center {
        width: 50%;
        height: 40%;
        background-color: burlywood;
        display: flex;
        flex-direction: column;
      }
      .first {
        width: 100%;
        height: 100%;
        background-color: rgb(170, 127, 70);
        font-size: 30px;
        display: grid;
        place-items: center;
      }
      .second {
        width: 100%;
        height: 100%;
        background-color: rgb(122, 84, 34);
        display: flex;
        font-size: 20px;
        justify-content: space-evenly;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="center">
        <div class="first">Time in New Year 2025</div>
        <div class="second">
          <div class="item">
            <h3>Days</h3>
            <h4 id="days">00</h4>
          </div>

          <div class="item">
            <h3>Hours</h3>
            <h4 id="hours">00</h4>
          </div>
          <div class="item">
            <h3>Minutes</h3>
            <h4 id="minutes">00</h4>
          </div>

          <div class="item">
            <h3>Seconds</h3>
            <h4 id="seconds">00</h4>
          </div>
        </div>
      </div>
    </div>
    <script>
      var center = document.querySelector(".center");
      var second = document.querySelector(".second");

      var days = document.getElementById("days");
      var hours = document.getElementById("hours");
      var minute = document.getElementById("minutes");
      var seconds = document.getElementById("seconds");

      var targetTime = new Date(2025, 0);
      setInterval(() => {
        let currentTime = new Date();
        let diff = targetTime - currentTime;

        //days
        let num = parseInt(diff / (1000 * 60 * 60 * 24));

        if (num < 10) days.innerHTML = `0${num}`;
        else days.innerHTML = num;

        //hours
        num = parseInt((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

        if (num < 10) hours.innerHTML = `0${num}`;
        else hours.innerHTML = num;

        //minutes
        num = parseInt((diff % (1000 * 60 * 60)) / (1000 * 60));

        if (num < 10) minutes.innerHTML = `0${num}`;
        else minutes.innerHTML = num;

        //seconds
        num = parseInt((diff % (1000 * 60)) / 1000);

        if (num < 10) seconds.innerHTML = `0${num}`;
        else seconds.innerHTML = num;
      }, 1000);
    </script>
  </body>
</html>
